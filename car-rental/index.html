<script>
'use strict';

// ==========================================
// CONFIGURATION: N8N TEST WEBHOOK URLS
// ==========================================
const WEBHOOK_GET_BOOKINGS           = 'https://n8n.automania.cloud/webhook-test/sh-get-bookings';
const WEBHOOK_POST_BOOKING           = 'https://n8n.automania.cloud/webhook-test/sh-new-booking';
const WEBHOOK_GET_INSPECTIONS        = 'https://n8n.automania.cloud/webhook-test/sh-get-inspections';
const WEBHOOK_POST_APPROVE           = 'https://n8n.automania.cloud/webhook-test/sh-approve-booking';
const WEBHOOK_POST_INVOICE           = 'https://n8n.automania.cloud/webhook-test/sh-send-invoice';
const WEBHOOK_POST_INSPECTION_REVIEW = 'https://n8n.automania.cloud/webhook-test/sh-review-inspection';

// SVG Icons
const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',car:'M5 17H3V9l2-5h14l2 5v8h-2 M5 17h14 M5 9h14 M7 13h.01 M17 13h.01 M5 17v3 M19 17v3',check:'m5 12 4 4L19 6',clipboard:'M9 4H5v17h14V4h-4 M9 2h6v5H9z M8 12l2 2 5-5 M8 18h7',calendar:'M4 5h16v16H4z M4 10h16 M8 2v6 M16 2v6 M8 14h2 M14 14h2 M8 17h2',search:'M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15 M16 16l5 5',plus:'M12 5v14 M5 12h14',arrow:'M4 12h16 m-6-6 6 6-6 6',close:'m6 6 12 12 M6 18 18 6',menu:'M4 6h16 M4 12h16 M4 18h16',users:'M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M2 21v-3a7 7 0 0 1 14 0v3 M17 3a4 4 0 0 1 0 8 M19 15a6 6 0 0 1 3 6',pin:'M12 22S4 14 4 9a8 8 0 0 1 16 0c0 5-8 13-8 13z M12 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6',image:'M3 3h18v18H3z m0 15 6-6 5 5 3-3 4 4 M15 7h.01',layers:'m12 3 10 5-10 5L2 8z M2 12l10 5 10-5 M2 16l10 5 10-5',folder:'M3 6h6l2 2h10v12H3z M3 6V4h6l2 2',invoice:'M5 3h14v19l-3-2-4 2-4-2-3 2z M8 8h8 M8 12h8 M8 16h5',print:'M6 9V3h12v6 M6 18H3V9h18v9h-3 M6 14h12v8H6z',mail:'M3 5h18v14H3z m0 0 9 8 9-8',chevron:'m9 5 7 7-7 7',refresh:'M20 8a8 8 0 1 0 0 8 M20 3v5h-5'};
function icon(n){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.grid}"/></svg>`}
function icons(){document.querySelectorAll('[data-icon]').forEach(x=>{x.innerHTML=icon(x.dataset.icon)})}

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',maximumFractionDigits:2}).format(Number(n)||0);
const date = s => new Date(s+'T12:00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short'});
const fullDate = s => new Date(s+'T12:00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});

// Local image map
const carImageName = name => String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.jpg';

// Local State
let state = { bookings: [], inspections: [], invoices: [], infrastructure: [], briefs: [] };
let page = 'overview', filter = 'All', query = '', calendarMonth = 9, calendarYear = 2026, toastTimer;

const titles = {
    overview: ['Overview', 'A clear view of your operations.'],
    calendar: ['Operations calendar', 'Your approved deployments, in one place.'],
    bookings: ['Car Bookings', 'Review requests, confirm details and manage deployments.'],
    inspections: ['Pre-inspections', 'View customer-submitted vehicle condition reports.'],
    infrastructure: ['Events & Setup', 'Manage event infrastructure and staging (Placeholder).'],
    briefs: ['Project Briefs', 'Turn incoming briefs into well-managed projects (Placeholder).']
};

function toast(s) {
    const t = document.getElementById('toast');
    t.textContent = s; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 5000);
}

function badge(s) {
    let c = /Pending|New/.test(s) ? 'pending' : /Approved|Reviewed/.test(s) ? 'approved' : /Declined|Flagged/.test(s) ? 'declined' : 'draft';
    return `<span class="badge ${c}">${esc(s)}</span>`
}

// ---------------------------------------------------------
// DATA FETCHING (n8n Integration)
// ---------------------------------------------------------
async function loadData(manualRefresh = false) {
    try {
        // Fetch Bookings
        const resBookings = await fetch(WEBHOOK_GET_BOOKINGS);
        if(resBookings.ok) {
            const rawData = await resBookings.json();
            // Handle both object {} and array [{}] structures from n8n
            const data = Array.isArray(rawData) ? rawData[0] : rawData;
            const fetchedBookings = data.bookings || [];
            
            // Map status fallback to handle empty strings from n8n safely
            state.bookings = fetchedBookings.map(b => ({...b, status: b.status || 'Pending'}));
        } else throw new Error('Fallback bookings');

        // Fetch Inspections
        const resInspections = await fetch(WEBHOOK_GET_INSPECTIONS);
        if(resInspections.ok) {
            const rawIData = await resInspections.json();
            // Handle both object {} and array [{}] structures from n8n
            const iData = Array.isArray(rawIData) ? rawIData[0] : rawIData;
            const fetchedInspections = iData.inspections || [];
            
            state.inspections = fetchedInspections.map(i => ({...i, status: i.status || 'Pending review'}));
        } else throw new Error('Fallback inspections');

        if(manualRefresh) toast('Workspace synchronized.');

    } catch (e) {
        // Fallback data
        state.bookings = [
            {id:'BK-1042', client:'Department of Works', contact:'Sylvester M.', email:'sylvester@example.com', service:'Hyundai Staria', start:'2026-10-14', end:'2026-10-16', status:'Pending', amount:7500, driver:'Sylvester M.', location:'Pretoria → Johannesburg', notes:'Executive airport transfers.'},
            {id:'BK-1040', client:'Summit Partners', contact:'Naledi S.', email:'summit@example.com', service:'Mercedes V-Class', start:'2026-10-12', end:'2026-10-13', status:'Approved', amount:8600, driver:'Assigned chauffeur', location:'OR Tambo → Pretoria', notes:'Return transfer and full-day executive transport.'}
        ];
        state.invoices = [{id:'INV-2026-040', bookingId:'BK-1040', amount:8600, tax:0, deposit:100, due:'2026-10-13', notes:'Executive transport package.', status:'Draft'}];
        
        state.inspections = [{id:'INSP-088', bookingId:'BK-1040', title:'Mercedes V-Class', client:'Summit Partners', driver:'Assigned chauffeur', clean:'4 / 5', fuel:'¾ tank', odometer:'42,180 km', status:'Pending review', notes:'Small scratch on rear bumper.', photoFront: '', photoRear: '', photoLeft: '', photoRight: ''}];
        state.infrastructure = [ {id:'EVT-001', title:'VIP Lounge Setup', client:'Northside Collective', location:'Centurion', date:'2026-10-16', status:'Approved'} ];
        state.briefs = [ {id:'PRJ-014', title:'Year-end summit', client:'Summit Partners', location:'Johannesburg', date:'2026-11-12', status:'New'} ];
        
        if(manualRefresh) toast('Network error. Loaded offline fallback data.');
        console.log("Using local fallback data.");
    }
    render();
}

// Event Listeners for Fetching
document.getElementById('refresh-btn').onclick = async () => {
    const svg = document.querySelector('#refresh-btn span svg');
    if(svg) svg.classList.add('spin');
    
    toast('Syncing with database...');
    await loadData(true);
    
    if(svg) svg.classList.remove('spin');
};

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        // Silently fetch data in background when tab becomes active
        loadData(false);
    }
});

// ---------------------------------------------------------
// UI RENDERING
// ---------------------------------------------------------
function nav() {
    const pending = state.bookings.filter(x => x.status === 'Pending').length;
    const item = (id, label, ic, count = '') => `<button class="nav-item ${page === id ? 'active' : ''}" data-nav="${id}">${icon(ic)}<span>${label}</span>${count !== '' ? `<span class="count">${count}</span>` : ''}</button>`;
    document.getElementById('nav').innerHTML = `
        <div class="nav-label">Workspace</div>
        ${item('overview', 'Overview', 'grid')}
        ${item('calendar', 'Calendar', 'calendar')}
        <div class="nav-label">Mobility</div>
        ${item('bookings', 'Car Bookings', 'car', pending)}
        ${item('inspections', 'Pre-inspections', 'clipboard')}
        <div class="nav-label">Other Services</div>
        ${item('infrastructure', 'Events & Setup', 'layers')}
        ${item('briefs', 'Project Briefs', 'folder')}
    `;
}

function setPage(p) {
    if (!titles[p]) p = 'overview';
    page = p; filter = 'All'; query = '';
    render(); window.scrollTo({ top: 0, behavior: 'instant' });
}

function bookingRows(list) {
    if (!list.length) return `<div class="page-empty">${icon('search')}<h3>No matching records</h3></div>`;
    return `<div class="table-wrap responsive"><table><thead><tr><th>Client / request</th><th>Vehicle</th><th class="date-column">Booking dates</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody>
    ${list.map((b, i) => `<tr>
        <td><div class="client-cell"><span class="avatar ${['', 'blue', 'green'][i % 3]}">${esc(b.client.charAt(0))}</span><div><strong>${esc(b.client)}</strong><small>${esc(b.id)} ·${esc(b.contact)}</small></div></div></td>
        <td><strong>${esc(b.service)}</strong></td>
        <td class="date-column">${date(b.start)} – ${date(b.end)}<small>${esc(b.start.slice(0, 4))}</small></td>
        <td>${badge(b.status)}</td>
        <td style="text-align:right">
            ${b.status === 'Approved' 
                ? `<button class="row-button" data-action="invoice" data-id="${b.id}">${icon('invoice')}Invoice</button>`
                : `<button class="row-button" data-action="booking" data-id="${b.id}">View${icon('chevron')}</button>`}
        </td>
    </tr>`).join('')}</tbody></table></div>`;
}

function bookingPanel() {
    const list = state.bookings.filter(b => (filter === 'All' || b.status === filter) && `${b.id} ${b.client} ${b.contact} ${b.service}`.toLowerCase().includes(query.toLowerCase()));
    return `<section class="panel">
        <div class="panel-head"><div><h2>Car Booking Requests</h2><p>Review and approve vehicle deployments based on ROI.</p></div></div>
        <div class="tabs">
            ${['All', 'Pending', 'Approved'].map(f => `<button class="tab ${filter === f ? 'active' : ''}" data-filter="${f}">${f}</button>`).join('')}
        </div>
        <div class="toolbar">
            <label class="searchbox">${icon('search')}<input id="booking-search" placeholder="Search clients or vehicles…" value="${esc(query)}"></label>
        </div>
        <div id="booking-results">${bookingRows(list)}</div>
    </section>`;
}

function overview() {
    return `<div class="dashboard-grid"><div>${bookingPanel()}</div><aside class="dashboard-aside"><section class="focus-card"><div class="eyebrow">PRIORITY</div><h2>Keep operations moving.</h2><p>Always price based on value provided to the client.</p></section></aside></div>`;
}

function inspections() {
    return `<div class="cards">${state.inspections.map(i => `
        <article class="request-card">
            <div style="display:flex;justify-content:space-between"><span class="eyebrow">${i.id}</span>${badge(i.status)}</div>
            <h3>${esc(i.title)}</h3><p>${esc(i.client)}</p>
            <div class="meta"><span>${icon('users')}${esc(i.driver)}</span><span>${icon('car')}${esc(i.odometer)} ·${esc(i.fuel)}</span></div>
            <div class="actions"><button class="btn primary" data-action="inspection" data-id="${i.id}">Review Submission ${icon('arrow')}</button></div>
        </article>`).join('')}
    </div>`;
}

function calendar() {
    let first = new Date(calendarYear, calendarMonth, 1), days = new Date(calendarYear, calendarMonth + 1, 0).getDate(), offset = (first.getDay() + 6) % 7;
    return `<section class="panel"><div class="panel-head"><h2>Vehicle Schedule</h2><div class="month-nav"><button class="icon-btn" data-action="month-prev">‹</button><strong>${first.toLocaleDateString('en-ZA', { month: 'long', year: 'numeric' })}</strong><button class="icon-btn" data-action="month-next">›</button></div></div>
    <div class="calendar-wrap"><div class="calendar">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="day-name">${d}</div>`).join('')}${Array.from({ length: offset }, () => '<div class="day empty"></div>').join('')}${Array.from({ length: days }, (_, j) => {
        const d = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(j + 1).padStart(2, '0')}`;
        return `<div class="day ${d === '2026-10-13' ? 'today' : ''}"><span>${j + 1}</span>${state.bookings.filter(b => b.start <= d && b.end >= d && b.status === 'Approved').map(b => `<button class="calendar-event" data-action="booking" data-id="${b.id}">${esc(b.service)}</button>`).join('')}
        </div>`
    }).join('')}</div></div><div class="panel-foot">Only approved bookings are mapped to the calendar.</div></section>`;
}

function placeholders(type) {
    if(!state[type] || !state[type].length) return `<div class="page-empty">${icon('layers')}<h3>No records found</h3><p>This module is currently a placeholder.</p></div>`;
    return `<div class="cards">${state[type].map(r=>`<article class="request-card"><div style="display:flex;justify-content:space-between"><span class="eyebrow">${r.id}</span>${badge(r.status)}</div><h3>${esc(r.title)}</h3><p>${esc(r.client)}</p><div class="meta"><span>${icon('pin')}${esc(r.location)}</span><span>${icon('calendar')}${date(r.date)}</span></div><div class="actions"><button class="btn ghost" disabled>UI Placeholder</button></div></article>`).join('')}</div>`;
}

function render() {
    nav();
    document.getElementById('crumb').textContent = titles[page][0];
    document.getElementById('main-content').innerHTML = `
        <div class="page-head">
            <div><div class="eyebrow">S&H WORKSPACE</div><h1>${titles[page][0]}</h1><p class="subtitle">${titles[page][1]}</p></div>
            <div class="actions">${page === 'bookings' || page === 'overview' ? `<button class="btn primary" data-action="new">${icon('plus')}New Booking</button>` : ''}</div>
        </div>
        ${({ overview, bookings: () => bookingPanel(), inspections, calendar, infrastructure: () => placeholders('infrastructure'), briefs: () => placeholders('briefs') })[page]()}
        <footer class="footer"><span>© 2026 S&H Consulting · Powered by Automania workflows</span></footer>
    `;
    icons();
}

// ---------------------------------------------------------
// DIALOGS & FORMS
// ---------------------------------------------------------
function openDialog(title, sub, body, foot = '') {
    const d = document.getElementById('dialog');
    d.innerHTML = `<div class="dialog-head"><div><h2>${title}</h2><small>${sub}</small></div><button class="icon-btn" data-action="close">${icon('close')}</button></div><div class="dialog-body">${body}</div>${foot ? `<div class="dialog-foot">${foot}</div>` : ''}`;
    if (!d.open) d.showModal(); d.scrollTop = 0;
}
function closeDialog() { document.getElementById('dialog').close(); }
const booking = id => state.bookings.find(b => b.id === id);

// View Booking
function viewBooking(id) {
    const b = booking(id);
    const carImg = carImageName(b.service);

    openDialog('Booking details', `${b.id}`, `
        <div class="booking-summary"><span class="summary-icon">${icon('car')}</span><div><h3>${esc(b.service)}</h3><p>${esc(b.client)}</p></div>${badge(b.status)}</div>
        <div class="car-image-box">
            <img src="${carImg}" alt="${esc(b.service)}" onerror="this.style.display='none'; this.parentElement.style.display='none';">
        </div>
        <div class="details-grid">
            ${[['Client contact', b.contact], ['Email', b.email], ['Dates', `${fullDate(b.start)} –${fullDate(b.end)}`], ['Location', b.location], ['Driver', b.driver], ['Projected Value', money(b.amount)]].map(([k, v]) => `<div class="detail"><small>${k}</small><strong>${esc(v)}</strong></div>`).join('')}
        </div>
        <h3 class="section-title">Operations note</h3><div class="info-box">${esc(b.notes)}</div>
    `, `<button class="btn" data-action="close">Close</button>
        ${b.status === 'Pending' ? `<button class="btn primary" data-action="approval" data-id="${id}">${icon('check')}Approve & Invoice</button>` : ''}
        ${b.status === 'Approved' ? `<button class="btn primary" data-action="invoice" data-id="${id}">${icon('invoice')}Manage Invoice</button>` : ''}`);
}

// Full Approval Flow triggering Test Webhook & Invoice View
function approval(id) {
    const b = booking(id);
    if (b.status !== 'Pending') return viewBooking(id);
    openDialog('Approve booking', `${b.id} · ${esc(b.client)}`, `
        <form id="approval-form">
            <div class="booking-summary"><span class="summary-icon">${icon('car')}</span><div><h3>${esc(b.service)}</h3><p>Confirm the final details and value before approval.</p></div></div>
            <div class="form-grid section-space">
                <label class="field full">Confirmed value (ZAR, before tax)<input type="number" name="amount" min="0.01" step="0.01" value="${b.amount}" required></label>
                <label class="field">Start date<input name="start" type="date" value="${b.start}" required></label>
                <label class="field">End date<input name="end" type="date" value="${b.end}" required></label>
                <label class="field full">Operations note<textarea name="notes">${esc(b.notes)}</textarea></label>
            </div>
            <div class="info-box section-space">Approving this will log the data to Google Sheets via the n8n test webhook and transition to invoice preparation.</div>
            <p id="approval-error" class="error" role="alert"></p>
        </form>
    `, `<button class="btn" data-action="booking" data-id="${id}">Back</button><button class="btn primary" type="submit" form="approval-form" id="approve-submit">${icon('check')}Approve Booking</button>`);
    
    document.getElementById('approval-form').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const start = f.get('start'), end = f.get('end'), amount = Number(f.get('amount'));
        if (end < start) { document.getElementById('approval-error').textContent = 'End date must be on or after the start date.'; return; }
        
        Object.assign(b, { start, end, amount, notes: f.get('notes'), status: 'Approved' });
        
        const btn = document.getElementById('approve-submit');
        btn.innerHTML = 'Sending...'; btn.disabled = true;

        try {
            await fetch(WEBHOOK_POST_APPROVE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
            toast('Booking approved via webhook. Preparing invoice.');
            render();
            invoice(id); 
        } catch (err) {
            toast('Warning: Could not reach n8n approval test webhook.');
            btn.innerHTML = 'Error'; btn.disabled = false;
        }
    }
}

// Generate Invoice Helper
function nextInvoiceId(){const n=Math.max(40,...state.invoices.map(i=>Number(i.id.split('-').at(-1))))+1;return 'INV-2026-'+String(n).padStart(3,'0')}

// Manage and Send Invoice View
function invoice(id) {
    const b = booking(id);
    if (b.status !== 'Approved') { toast('Approve this booking before preparing an invoice.'); return viewBooking(id); }
    
    const existing = state.invoices.find(i => i.bookingId === id);
    const draft = existing ? structuredClone(existing) : { id: nextInvoiceId(), bookingId: id, amount: b.amount, tax: 0, deposit: 50, due: b.start, notes: '', status: 'Draft' };
    
    openDialog('Prepare invoice', `${draft.id} · ${esc(b.client)}`, `
        <div class="invoice-layout">
            <form class="invoice-editor" id="invoice-form">
                <div class="form-grid">
                    <label class="field full">Recipient email<input name="email" type="email" required value="${esc(b.email)}"></label>
                    <label class="field full">Service amount (ZAR)<input name="amount" type="number" step="0.01" required value="${draft.amount}"></label>
                    <label class="field">Tax rate (%)<input name="tax" type="number" min="0" max="100" step="0.01" value="${draft.tax}" required></label>
                    <label class="field">Deposit (%)<input name="deposit" type="number" min="0" max="100" value="${draft.deposit}" required></label>
                    <label class="field full">Payment due date<input name="due" type="date" required value="${draft.due}"></label>
                    <label class="field full">Invoice notes<textarea name="notes" placeholder="Payment terms or service notes…">${esc(draft.notes)}</textarea></label>
                </div>
                <div class="info-box section-space">Sending this invoice triggers the n8n test webhook. Ensure n8n is actively listening.</div>
            </form>
            <div class="invoice-paper" id="invoice-paper"></div>
        </div>
    `, `<button class="btn" data-action="close">Close</button><button class="btn" id="print-invoice">${icon('print')}Print / PDF</button><button class="btn primary" id="send-invoice">${icon('mail')}Send via n8n</button>`);
    
    const form = document.getElementById('invoice-form');
    const read = () => { const f = new FormData(form); return { ...draft, amount: Number(f.get('amount')), tax: Number(f.get('tax')), deposit: Number(f.get('deposit')), due: f.get('due'), notes: f.get('notes'), email: f.get('email') }};
    
    function preview() {
        const i = read(), total = i.amount * (1 + i.tax / 100);
        document.getElementById('invoice-paper').innerHTML = `
            <div class="brand"><span class="monogram">S&H</span><span><strong>S&H CONSULTING</strong><small>MOBILITY PORTAL</small></span></div>
            <div class="eyebrow">INVOICE PREVIEW</div><h2>${i.id}</h2>
            <div class="invoice-meta"><div><small>BILL TO</small><br><strong>${esc(b.client)}</strong><br>${esc(i.email)}</div><div><small>BOOKING</small><br>${b.id}<br>Due ${i.due ? date(i.due) : '—'}</div></div>
            <div class="invoice-line"><span>${esc(b.service)}<br><small>${fullDate(b.start)} – ${fullDate(b.end)}</small></span><b>${money(i.amount)}</b></div>
            <div class="invoice-line"><span>Tax (${i.tax||0}%)</span><span>${money(i.amount * i.tax / 100)}</span></div>
            <div class="invoice-total"><b>Total</b><b>${money(total)}</b></div>
            <div class="invoice-line"><span>Deposit (${i.deposit||0}%)</span><b>${money(total * i.deposit / 100)}</b></div>
            <div class="invoice-line"><span>Remaining balance</span><span>${money(total * (1 - i.deposit / 100))}</span></div>
            <small style="display:block;white-space:pre-wrap;overflow-wrap:anywhere">${esc(i.notes) || 'Thank you for choosing S&H Consulting.'}</small>
            <div class="watermark">${i.status === 'Sent' ? 'SENT' : 'DRAFT · NOT SENT'}</div>
        `;
    }
    
    function persist() {
        if(!form.reportValidity()) return null;
        const i = read();
        const index = state.invoices.findIndex(x => x.bookingId === id);
        if(index < 0) state.invoices.unshift(i); else state.invoices[index] = i;
        b.email = i.email;
        return i;
    }
    
    form.addEventListener('input', preview); 
    preview();
    
    document.getElementById('print-invoice').onclick = () => { if(persist()){ preview(); window.print(); }};
    
    document.getElementById('send-invoice').onclick = async () => {
        const i = persist();
        if(!i) return;
        const btn = document.getElementById('send-invoice');
        btn.innerHTML = 'Sending...'; btn.disabled = true;
        
        try {
            await fetch(WEBHOOK_POST_INVOICE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ invoice: i, booking: b, recipient: i.email }) });
            toast('Invoice successfully routed to n8n test webhook.');
            i.status = 'Sent';
            preview();
        } catch (err) {
            toast('Warning: Could not reach n8n invoice test webhook.');
        } finally {
            btn.innerHTML = `${icon('mail')}Send via n8n`; btn.disabled = false;
        }
    };
}

// New Booking
function newBooking() {
    openDialog('Create car booking', 'Send request to n8n webhook.', `
        <form id="new-form">
            <div class="form-grid">
                <label class="field">Client / organisation<input name="client" required></label>
                <label class="field">Contact person<input name="contact" required></label>
                <label class="field">Email address<input name="email" type="email" required></label>
                <label class="field">Vehicle requested<input name="service" required placeholder="e.g. Mercedes V-Class"></label>
                <label class="field">Start date<input name="start" type="date" required></label>
                <label class="field">End date<input name="end" type="date" required></label>
                <label class="field">Value based pricing (ZAR)<input name="amount" type="number" step="0.01" required></label>
                <label class="field">Route / Location<input name="location" required></label>
                <label class="field full">Request notes<textarea name="notes"></textarea></label>
            </div>
        </form>
    `, `<button class="btn" data-action="close">Cancel</button><button class="btn primary" id="btn-submit-booking" form="new-form" type="submit">${icon('plus')}Send to n8n</button>`);
    
    document.getElementById('new-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit-booking');
        btn.innerHTML = 'Sending...'; btn.disabled = true;

        const f = Object.fromEntries(new FormData(e.target));
        const n = Math.max(...state.bookings.map(b => Number(b.id.split('-')[1])), 1044) + 1;
        const b = { ...f, amount: Number(f.amount), id: 'BK-' + n, status: 'Pending', driver: 'Pending' };
        
        try {
            await fetch(WEBHOOK_POST_BOOKING, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
            state.bookings.unshift(b);
            closeDialog(); setPage('bookings'); 
            toast('Successfully saved to Google Sheets via n8n test webhook.');
        } catch (err) {
            toast('Network error: Test webhook not reached.');
            btn.innerHTML = `${icon('plus')}Send to n8n`; btn.disabled = false;
        }
    };
}

// View Pre-inspection Admin Logic
function viewInspection(id) {
    const r = state.inspections.find(i => i.id === id);
    
    const renderPhoto = (url, label) => url ? 
        `<div class="photo-placeholder" style="border:none"><a href="${url}" target="_blank" title="Click to view full image"><img src="${url}" class="photo-preview" alt="${label}"></a></div>` : 
        `<div class="photo-placeholder">${icon('image')}<span style="margin-top:5px;font-weight:600">${label}</span><small>No image submitted</small></div>`;

    openDialog('Review pre-inspection', `${id} · Submitted by customer/driver`, `
        <div class="booking-summary"><span class="summary-icon">${icon('car')}</span><div><h3>${esc(r.title)}</h3><p>${esc(r.client)}</p></div>${badge(r.status)}</div>
        <div class="details-grid">
            <div class="detail"><small>Odometer (km)</small><strong>${esc(r.odometer)}</strong></div>
            <div class="detail"><small>Fuel Level</small><strong>${esc(r.fuel)}</strong></div>
            <div class="detail"><small>Cleanliness</small><strong>${esc(r.clean)}</strong></div>
        </div>
        
        <h3 class="section-title">Submitted Condition Photos</h3>
        <div class="photo-grid">
            ${renderPhoto(r.photoFront, 'Front')}
            ${renderPhoto(r.photoRear, 'Rear')}
            ${renderPhoto(r.photoLeft, 'Left Side')}
            ${renderPhoto(r.photoRight, 'Right Side')}
        </div>
        <h3 class="section-title">Notes</h3>
        <div class="info-box">${esc(r.notes)}</div>
    `, `<button class="btn" data-action="close">Close</button>
        ${r.status === 'Pending review' ? `<button class="btn primary" id="btn-mark-reviewed" data-action="mark-reviewed" data-id="${id}">${icon('check')}Mark Reviewed</button>` : ''}`);
}

// ---------------------------------------------------------
// EVENT DELEGATION
// ---------------------------------------------------------
document.addEventListener('click', e => {
    const n = e.target.closest('[data-nav]');
    if (n) { setPage(n.dataset.nav); return; }
    
    const ft = e.target.closest('[data-filter]');
    if (ft) { filter = ft.dataset.filter; render(); return; }
    
    const el = e.target.closest('[data-action]');
    if (!el) return;
    
    const a = el.dataset.action, id = el.dataset.id;
    switch (a) {
        case 'close': closeDialog(); break;
        case 'new': newBooking(); break;
        case 'booking': viewBooking(id); break;
        case 'approval': approval(id); break;
        case 'invoice': invoice(id); break;
        case 'inspection': viewInspection(id); break;
        case 'mark-reviewed':
            let i = state.inspections.find(x => x.id === id);
            if(i) {
                const btn = document.getElementById('btn-mark-reviewed');
                if(btn) { btn.innerHTML = 'Updating...'; btn.disabled = true; }
                
                fetch(WEBHOOK_POST_INSPECTION_REVIEW, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ inspectionId: id, status: 'Reviewed' }) 
                })
                .then(() => {
                    i.status = 'Reviewed';
                    closeDialog(); render(); toast('Inspection marked as reviewed.');
                })
                .catch(err => {
                    toast('Warning: Could not reach n8n test webhook.');
                    if(btn) { btn.innerHTML = `${icon('check')}Mark Reviewed`; btn.disabled = false; }
                });
            }
            break;
        case 'month-prev': case 'month-next':
            calendarMonth += a === 'month-next' ? 1 : -1;
            if (calendarMonth > 11) { calendarMonth = 0; calendarYear++ }
            if (calendarMonth < 0) { calendarMonth = 11; calendarYear-- }
            render(); break;
    }
});

document.addEventListener('input', e => {
    if (e.target.id === 'booking-search') { query = e.target.value; render(); }
});

// INITIALIZE
loadData();

</script>
