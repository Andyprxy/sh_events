<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142622">
<meta name="description" content="S&H Operations portal — car bookings, inspections, events and projects.">
<title>S&H | Operations Portal</title>
<link rel="preconnect" href="https://n8n.automania.cloud" crossorigin>
<link rel="preconnect" href="https://i.ibb.co" crossorigin>
<style>
/* Core Styles */
:root{
    --ink:#182b32;
    --nav:#14282e;
    --muted:#77838a;
    --gold:#b5985e;
    --gold-light:#f4ecd9;
    --line:#e5e9e7;
    --bg:#f6f7f4;
    --green:#28745b;
    --red:#b95249;
    --shadow:0 12px 45px #18322b0c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;color:var(--ink);line-height:1.5}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer;color:inherit;transition:background .15s,transform .15s,border-color .15s}
button:disabled{cursor:not-allowed;opacity:.45}
button:hover:not(:disabled){filter:brightness(.97)}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b5985e88;outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:30px;letter-spacing:-1px;font-weight:650}
h2{font-size:17px;letter-spacing:-.3px;font-weight:650}
h3{font-size:15px}
small,.muted{color:var(--muted)}
svg{width:19px;height:19px;flex:none;stroke:currentColor;stroke-width:1.65;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Sidebar */
.side{width:234px;position:fixed;inset:0 auto 0 0;background:var(--nav);color:#d5dedd;display:flex;flex-direction:column;padding:28px 17px 18px;z-index:30;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:12px;padding:0 13px 29px}
.monogram{font-family:Georgia,serif;font-style:italic;font-size:29px;line-height:1;color:var(--gold);border:1px solid #b5985e66;width:49px;height:49px;display:grid;place-items:center;border-radius:8px;letter-spacing:-4px;padding-right:4px}
.brand strong{font-size:13px;letter-spacing:1.6px;color:#fff}
.brand small{display:block;font-size:10px;letter-spacing:2px;margin-top:5px;color:#8fa4a8}
.nav-label{font-size:9px;letter-spacing:1.8px;color:#7d999e;text-transform:uppercase;padding:22px 15px 8px}
.nav-item{display:flex;align-items:center;width:100%;gap:12px;border:0;background:none;color:#adc0c2;min-height:44px;border-radius:7px;padding:11px 13px;font-size:12px;text-align:left;margin-bottom:4px}
.nav-item.active{background:#b5985e1f;color:#ddc18a;box-shadow:inset 2px 0 #ccb077}
.nav-item:hover{background:#ffffff0b}
.count{margin-left:auto;background:#ffffff10;border-radius:4px;padding:1px 6px;font-size:10px}
.side nav{overflow-y:auto;min-height:0;scrollbar-width:thin}
.side-bottom{margin-top:auto;padding-top:25px}
.workspace-tag{padding:12px;border:1px solid #ffffff14;border-radius:8px;margin-bottom:17px;font-size:11px;display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;flex:none}
.profile{display:flex;align-items:center;gap:10px;padding:9px 8px;border-top:1px solid #ffffff13}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eee8d9;color:#7e673d;font-size:11px;font-weight:700;flex:none}
.profile strong{font-size:11px;color:#e5edec}
.profile small{display:block;font-size:10px}
.menu-backdrop{display:none;position:fixed;inset:0;background:#10232866;z-index:25;border:0}

/* Main Layout */
.main{margin-left:234px;min-width:0}
.topbar{height:77px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 34px;position:sticky;top:0;z-index:20}
.breadcrumb{font-size:11px;color:var(--muted)}
.breadcrumb b{font-weight:500;color:var(--ink)}
.top-actions{display:flex;align-items:center;gap:13px}
.searchbox{display:flex;align-items:center;gap:9px;max-width:260px;background:#f6f7f4;padding:6px 11px;border-radius:7px;border:1px solid var(--line)}
.searchbox svg{width:16px;color:var(--muted)}
.searchbox input{border:0;background:transparent;width:180px;font-size:11px;outline:none}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:7px;background:#fff;position:relative;cursor:pointer}
.mobile-menu{display:none}
.content{padding:30px 34px;max-width:1630px;margin:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px;flex-wrap:wrap}
.eyebrow{font-size:9px;letter-spacing:1.8px;color:#8a784e;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.subtitle{font-size:12px;color:var(--muted);margin-top:5px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;min-height:40px;padding:10px 15px;border-radius:7px;font-size:11px;font-weight:600;white-space:nowrap}
.btn svg{width:15px;height:15px}
.primary{background:var(--ink);border-color:var(--ink);color:white}
.gold-btn{background:var(--gold-light);border-color:#dfd0ae;color:#6e5a31}
.danger{color:var(--red);border-color:#e8cecb}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* KPI Strip */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.kpi-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:0 3px 8px #15302902}
.kpi-card small{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.kpi-card strong{display:block;font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi-card span{display:inline-block;font-size:10px;color:var(--muted);margin-top:4px}

/* Panels & Tables */
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 3px 8px #15302902;margin-bottom:22px}
.panel-head{padding:20px 21px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-head p{font-size:11px;color:var(--muted);margin-top:4px}
.panel-foot{padding:12px 21px;background:#fafbf8;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:23px;padding:0 22px;border-bottom:1px solid var(--line);overflow:auto}
.tab{padding:12px 0;border:0;border-bottom:2px solid transparent;background:none;font-size:11px;color:var(--muted);white-space:nowrap}
.tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:650}
.tab span{font-size:9px;padding:2px 5px;border-radius:4px;background:#f2f3ef;margin-left:5px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:11px}
th{background:#fafbf8;color:#8b9595;font-size:9px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;padding:12px 18px;white-space:nowrap}
td{padding:15px 18px;border-top:1px solid #eef0ed;vertical-align:middle}
td small{display:block;font-size:10px;margin-top:3px;color:var(--muted)}
td strong{font-size:11px;font-weight:600}
.client-cell{display:flex;align-items:center;gap:10px}
.client-cell .avatar{border-radius:8px;width:32px;height:32px;font-size:10px}
.client-cell .blue{background:#eaf0f3;color:#5d7a8c}
.client-cell .green{background:#e9f0e9;color:#638269}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:4px 8px;font-size:9px;white-space:nowrap;font-weight:600}
.badge:before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}
.pending{color:#a17e37;background:#f8f1df}
.approved,.reviewed,.clean,.full{color:#2d7a5f;background:#eaf4ee}
.declined,.flagged{color:#b45c52;background:#faece9}
.draft{color:#637074;background:#eef1f0}
.row-button{border:1px solid #dfe5e1;padding:6px 10px;border-radius:6px;font-size:10px;font-weight:550;background:#fff;min-height:32px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.row-button:hover{border-color:var(--gold);background:#fcfaf5}
.row-button svg{width:13px;height:13px;color:#8a784e}

/* Pre-Inspection Specific Table Elements */
.id-pill{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:11px;background:#f2f4f1;border:1px solid #dfe4e0;padding:3px 7px;border-radius:5px;color:var(--ink)}
.condition-list{display:flex;flex-wrap:wrap;gap:5px;max-width:280px}
.cond-tag{font-size:9.5px;padding:3px 7px;border-radius:4px;background:#f4f6f3;border:1px solid #e3e8e4;color:#415258;white-space:nowrap}
.cond-tag b{color:var(--ink);font-weight:600}
.file-pills{display:flex;flex-wrap:wrap;gap:5px;max-width:320px}
.view-file-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:5px;border:1px solid #dfd7c4;background:#fbf8f1;color:#685630;font-size:9.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.view-file-btn:hover{background:#f3ebd9;border-color:var(--gold)}
.view-file-btn svg{width:12px;height:12px;color:var(--gold)}
.licence-cell{display:flex;align-items:center;gap:8px}
.mini-thumb{width:34px;height:26px;border-radius:4px;object-fit:cover;border:1px solid var(--line);background:#f2f3ef;cursor:pointer;flex:none}

/* Focus & Aside Cards */
.focus-card{background:var(--nav);border-radius:10px;padding:22px;color:#fff;margin-bottom:21px;position:relative;overflow:hidden}
.focus-card .eyebrow{color:#d1b57a}
.focus-card h2{font-size:19px;max-width:240px;margin-top:10px;line-height:1.4}
.focus-card p{font-size:11px;color:#a6babb;margin-top:9px;line-height:1.7}
.aside-list{padding:6px 18px 18px;display:grid;gap:10px}
.aside-item{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fafbf9;display:flex;justify-content:space-between;align-items:center;gap:10px}
.aside-item strong{font-size:11px;display:block}
.aside-item small{font-size:10px;color:var(--muted)}

.toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.page-empty{padding:50px 20px;text-align:center}
.page-empty svg{width:30px;height:30px;color:var(--gold)}
.page-empty h3{margin:12px 0 5px}
.page-empty p{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.request-card{padding:21px;background:#fff;border:1px solid var(--line);border-radius:10px}
.info-box{background:#f6f7f3;border:1px solid var(--line);border-radius:7px;padding:13px;font-size:11px;color:#526159;line-height:1.7}

/* Skeleton Loader */
@keyframes pulseBg { 0%,100%{opacity:.55} 50%{opacity:1} }
.skeleton-row{height:48px;background:#f2f4f1;border-radius:6px;margin:10px 18px;animation:pulseBg 1.2s ease-in-out infinite}

/* Dialogs & Modals */
.drawer-dialog{border:0;padding:0;border-radius:13px;width:min(920px,calc(100% - 28px));max-height:calc(100dvh - 36px);color:var(--ink);box-shadow:0 30px 120px #00191550;background:#fff}
.drawer-dialog::backdrop{background:#10232888;backdrop-filter:blur(4px)}
.dialog-head{padding:20px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;background:#fff;z-index:5}
.dialog-head h2{font-size:19px}
.dialog-body{padding:24px 25px;overflow-y:auto}
.dialog-foot{padding:16px 25px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;background:#fbfcfa;position:sticky;bottom:0;z-index:5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.field{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:550}
.field input,.field select,.field textarea{border:1px solid #dfe5df;border-radius:6px;padding:10px 12px;min-height:40px;width:100%;color:var(--ink);background:white}
.field textarea{min-height:80px;resize:vertical}
.full{grid-column:1/-1}
.details-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;margin:18px 0 22px}
.detail{background:#fafbf8;border:1px solid var(--line);padding:11px 13px;border-radius:7px}
.detail small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;color:var(--muted)}
.detail strong{font-size:12px;font-weight:600;overflow-wrap:anywhere}
.booking-summary{display:flex;align-items:center;gap:14px;background:#f5f6f2;padding:15px;border-radius:8px;border:1px solid var(--line)}
.booking-summary .summary-icon{background:#e9ebdf;border-radius:9px;width:43px;height:43px;display:grid;place-items:center;color:#8c7b50}
.booking-summary .badge{margin-left:auto}
.booking-summary h3{font-size:14px}
.section-title{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;margin:24px 0 12px;color:#8a7952;font-weight:700}

/* Photo Grid & Visible Image Cards */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.photo-card{background:#fafbf9;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.photo-frame{position:relative;height:135px;background:#eef0ec;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s;cursor:pointer}
.photo-frame img:hover{transform:scale(1.04)}
.photo-foot{padding:9px 11px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line);background:#fff}
.photo-foot strong{font-size:10.5px}
.licence-showcase{display:grid;grid-template-columns:240px 1fr;gap:18px;background:#fafbf8;border:1px solid var(--line);border-radius:9px;padding:15px;align-items:center}
.licence-img-wrap{height:145px;background:#eef0ec;border-radius:7px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.licence-img-wrap img{width:100%;height:100%;object-fit:cover;cursor:pointer}

/* Lightbox Viewer Modal */
.lightbox-stage{background:#101d21;border-radius:9px;min-height:380px;max-height:62vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:12px}
.lightbox-stage img{max-width:100%;max-height:58vh;object-fit:contain;border-radius:6px;box-shadow:0 12px 35px #0006}
.lightbox-strip{display:flex;gap:8px;overflow-x:auto;padding-top:14px;margin-top:12px;border-top:1px solid var(--line)}
.strip-thumb{border:2px solid transparent;border-radius:6px;padding:5px 10px;background:#f4f5f2;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.strip-thumb.active{border-color:var(--gold);background:var(--gold-light);color:#5e4c26}

/* Calendar */
.month-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calendar-wrap{overflow-x:auto}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));border-left:1px solid var(--line)}
.day-name{font-size:10px;text-align:center;padding:12px;background:#fafbf8;color:var(--muted);font-weight:600;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.day{min-height:115px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px;font-size:11px;display:flex;flex-direction:column;gap:4px}
.day-num{font-weight:600;font-size:10.5px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between}
.day.today{background:#fcf9f0}
.day.today .day-num{color:#8a784e;font-weight:700}
.calendar-event{display:block;text-align:left;width:100%;font-size:9.5px;background:#e9f1ec;border:0;border-left:3px solid #28745b;padding:5px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--ink);font-weight:550}
.calendar-event.pending-ev{background:#f8f1df;border-left-color:#b5985e;color:#6e5626}
.calendar-event small{display:block;font-size:8.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.day.empty{background:#fafbf8}

/* Invoice Specific Styles */
.invoice-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.invoice-paper{border:1px solid var(--line);padding:24px;border-radius:8px;background:#fdfefa}
.invoice-paper .brand{padding:0 0 22px}
.invoice-paper .brand strong{color:var(--ink);font-size:10px}
.invoice-paper h2{font-size:24px}
.invoice-meta{display:flex;justify-content:space-between;margin:19px 0;font-size:10px;gap:15px}
.invoice-line{border-top:1px solid var(--line);padding:14px 0;font-size:11px;display:flex;justify-content:space-between;gap:10px}
.invoice-total{background:var(--nav);color:#fff;border-radius:6px;padding:13px;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.invoice-paper small{font-size:9px}
.invoice-paper .watermark{margin-top:22px;text-align:center;font-size:9px;letter-spacing:2px;color:#9d9175}

.toast{position:fixed;bottom:25px;left:calc(50% + 100px);transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;background:#1b3236;color:#fff;border-radius:9px;padding:13px 20px;font-size:12px;box-shadow:0 8px 40px #0003;z-index:100;display:none}
.toast.show{display:block}
.footer{padding:20px 0 10px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@keyframes spin { 100% { transform: rotate(360deg); } }
.spin { animation: spin 0.8s linear infinite; }

@media print{
    body>*:not(dialog){display:none!important}
    dialog{position:static!important;display:block!important;width:100%!important;max-height:none!important;overflow:visible!important;box-shadow:none!important}
    dialog::backdrop{display:none}
    .dialog-head,.dialog-foot,.invoice-editor,.no-print{display:none!important}
    .dialog-body{padding:0}
    .invoice-layout{display:block}
    .invoice-paper{border:0;padding:20px}
    .invoice-total{color:#000;border:1px solid #aaa;background:white}
}
@media(max-width:1024px){
    .dashboard-grid{grid-template-columns:1fr}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .photo-grid{grid-template-columns:repeat(2,1fr)}
    .details-grid{grid-template-columns:repeat(2,1fr)}
    .licence-showcase{grid-template-columns:1fr}
}
@media(max-width:760px){
    .side{transform:translateX(-100%)}
    .side.open{transform:translateX(0)}
    .menu-backdrop.open{display:block}
    .main{margin-left:0}
    .mobile-menu{display:inline-grid}
    .topbar{padding:0 18px}
    .content{padding:20px 18px}
    .invoice-layout,.form-grid,.details-grid{grid-template-columns:1fr}
    .toast{left:50%}
}
</style>
</head>
<body>
<button id="menu-overlay" class="menu-backdrop" aria-label="Close navigation"></button>
<aside class="side" id="sidebar">
    <a class="brand" href="#overview">
        <span class="monogram">S&H</span>
        <span><strong>S&H CONSULTING</strong><small>OPERATIONS PORTAL</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-bottom">
        <div class="workspace-tag"><span class="dot" id="sync-dot"></span><span>Live Workspace<small id="sync-status" style="display:block;font-size:9px">Connecting to webhook…</small></span></div>
        <div class="profile"><span class="avatar">BM</span><span><strong>Brian Maphumulo</strong><small>Operations Admin</small></span></div>
    </div>
</aside>

<div class="main">
    <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="icon-btn mobile-menu" id="menu-btn" aria-label="Open menu"><span data-icon="menu"></span></button>
            <div class="breadcrumb">Workspace <span style="margin:0 10px;color:#c0c8c6">/</span> <b id="crumb">Overview</b></div>
        </div>
        <div class="top-actions">
            <label class="searchbox"><span data-icon="search"></span><input id="global-search" placeholder="Search ID, client, vehicle…"><small>↵</small></label>
            <button class="icon-btn" id="refresh-btn" title="Sync Latest Webhook Data"><span data-icon="refresh"></span></button>
            <span class="avatar">BM</span>
        </div>
    </header>
    <main class="content" id="main-content" tabindex="-1"></main>
</div>

<dialog class="drawer-dialog" id="dialog"></dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';

// ==========================================
// CONFIGURATION: PRODUCTION API ENDPOINTS
// ==========================================

function parseSafeDate(s) {
    if (!s) return null;
    const str = String(s).trim();
    const isoMatch = str.match(/^(\d{4}-\d{2}-\d{2})/);
    if (isoMatch) {
        const d = new Date(isoMatch[1] + 'T12:00:00');
        if (!isNaN(d.getTime())) return d;
    }
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
}
function toYMD(s) {
    const d = parseSafeDate(s);
    if (!d) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}
const date = s => {
    const d = parseSafeDate(s);
    return d ? d.toLocaleDateString('en-ZA',{day:'numeric',month:'short'}) : esc(s || '—');
};
const fullDate = s => {
    const d = parseSafeDate(s);
    return d ? d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}) : esc(s || '—');
};
const humanize = s => {
    if (s === undefined || s === null || String(s).trim() === '') return '—';
    return String(s).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
};

// Persistent cache for resolved ibb.co viewer links (0ms lookup on repeat visits)
let resolvedImageCache = {};
try {
    resolvedImageCache = JSON.parse(localStorage.getItem(IMG_CACHE_KEY) || '{}');

// Lazy, on-demand resolver ONLY triggered if an ibb.co viewer link is clicked or fails direct <img> load
async function resolveImgBBUrl(url) {
    if (!url) return '';
    const trimmed = String(url).trim();
    if (resolvedImageCache[trimmed]) return resolvedImageCache[trimmed];
    if (/^https?:\/\/i\.ibb\.co\//i.test(trimmed) || /\.(jpg|jpeg|png|webp|gif|svg)(\?.*)?$/i.test(trimmed)) {
        return trimmed;
    }
    if (/^https?:\/\/(www\.)?ibb\.co\/[A-Za-z0-9]+/i.test(trimmed)) {
        try {
            const resp = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(trimmed)}`);
            if (resp.ok) {
                const html = await resp.text();
                const match = html.match(/property=["']og:image["']\s+content=["']([^"']+)["']/i) ||
                              html.match(/content=["']([^"']+i\.ibb\.co[^"']+)["']/i);
                if (match && match[1]) {
                    resolvedImageCache[trimmed] = match[1];
                    try { localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(resolvedImageCache)); } catch (_) {}
                    return match[1];
                }
            }
        } catch (_) {}
    }
    return trimmed;
}

// On-error handler for thumbnails that might be ibb.co page links instead of direct i.ibb.co links
window.handleImgError = async function(imgEl) {
    if (!imgEl || imgEl.dataset.retried) {
        if (imgEl) imgEl.style.display = 'none';
        return;
    }
    imgEl.dataset.retried = '1';
    const raw = imgEl.dataset.rawUrl || imgEl.getAttribute('src');
    const resolved = await resolveImgBBUrl(raw);
    if (resolved && resolved !== raw) {
        imgEl.src = resolved;
        imgEl.style.display = '';
    } else {
        imgEl.style.display = 'none';
    }
};

// ==========================================
// UNIVERSAL WEBHOOK PAYLOAD UNPACKER
// ==========================================
function extractRows(rawData) {
    if (!rawData) return [];

    // 1. Direct Array of ~9 items: [ {...}, {...}, ... ] or [ { json: {...} }, ... ]
    if (Array.isArray(rawData)) {
        // Check if n8n returned a single wrapper object inside an array: [ { bookings: [...] } ]
        if (rawData.length === 1 && rawData[0] && typeof rawData[0] === 'object') {
            const first = rawData[0].json ? rawData[0].json : rawData[0];
            for (const k of ['bookings', 'data', 'rows', 'items', 'records', 'result']) {
                if (Array.isArray(first[k])) return extractRows(first[k]);
            }
        }
        // Unwrap each item in the array
        const flat = [];
        for (const item of rawData) {
            if (!item || typeof item !== 'object') continue;
            const unwrapped = (item.json && typeof item.json === 'object') ? item.json : item;
            if (Array.isArray(unwrapped)) {
                flat.push(...extractRows(unwrapped));
            } else {
                flat.push(unwrapped);
            }
        }
        return flat.filter(r => r && typeof r === 'object' && Object.keys(r).length > 0);
    }

    // 2. Object wrapper: { bookings: [...] }, { data: [...] }, { rows: [...] }, etc.
    if (typeof rawData === 'object') {
        for (const k of ['bookings', 'data', 'rows', 'items', 'records', 'result']) {
            if (Array.isArray(rawData[k])) return extractRows(rawData[k]);
        }
        // Check if any property on the object is an array of objects
        for (const val of Object.values(rawData)) {
            if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'object') {
                return extractRows(val);
            }
        }
        // Single row object
        if (rawData.booking_id || rawData.id || rawData.client || rawData.service || rawData.row_number) {
            return [rawData];
        }
    }

    return [];
}

function normalizeRow(raw, idx = 0) {
    const bookingId = String(raw.booking_id || raw.id || `ROW-${raw.row_number || (idx + 1)}`).trim();
    const startDate = toYMD(raw.start_date || raw.start);
    const endDate   = toYMD(raw.end_date || raw.end || startDate);

    const cleanUrl = u => {
        const s = String(u ?? '').trim();
        return (/^https?:\/\//i.test(s)) ? s : '';
    };

    const photoFields = [
        { key: 'photo_front',     short: 'Front',     label: 'Front View',           url: cleanUrl(raw.photo_front ?? raw.photoFront) },
        { key: 'photo_rear',      short: 'Rear',      label: 'Rear View',            url: cleanUrl(raw.photo_rear ?? raw.photoRear) },
        { key: 'photo_left',      short: 'Left',      label: 'Left Side',            url: cleanUrl(raw.photo_left ?? raw.photoLeft) },
        { key: 'photo_right',     short: 'Right',     label: 'Right Side',           url: cleanUrl(raw.photo_right ?? raw.photoRight) },
        { key: 'photo_interior',  short: 'Interior',  label: 'Interior Cabin',       url: cleanUrl(raw.photo_interior ?? raw.photoInterior) },
        { key: 'photo_dashboard', short: 'Dashboard', label: 'Dashboard / Odometer', url: cleanUrl(raw.photo_dashboard ?? raw.photoDashboard) },
        { key: 'photo_damage',    short: 'Damage',    label: 'Damage / Exterior',    url: cleanUrl(raw.photo_damage ?? raw.photoDamage) }
    ];

    const driverLicenceUrl = cleanUrl(raw.driver_licence ?? raw.driver_license ?? raw.licence);
    const attachedPhotos = photoFields.filter(p => Boolean(p.url));

    const hasInspectionData = Boolean(
        raw.fuel_level || raw.interior_status || raw.exterior_status ||
        raw.handover_date || attachedPhotos.length > 0 || driverLicenceUrl
    );

    const rawAmount = typeof raw.amount === 'string'
        ? Number(raw.amount.replace(/[^0-9.-]+/g, ''))
        : Number(raw.amount);

    return {
        row_number: raw.row_number ?? (idx + 2),
        id: bookingId,
        booking_id: bookingId,
        timestamp: String(raw.timestamp ?? '').trim(),
        client: String(raw.client || 'Unspecified Client').trim(),
        contact: String(raw.contact || raw.driver || '—').trim(),
        email: String(raw.email || '—').trim(),
        service: String(raw.service || 'Vehicle Deployment').trim(),
        start: startDate,
        end: endDate,
        start_date: startDate,
        end_date: endDate,
        amount: isNaN(rawAmount) ? 0 : rawAmount,
        location: String(raw.location || raw.handover_location || '—').trim(),
        notes: String(raw.notes || '—').trim(),
        status: String(raw.status || 'Pending').trim(),
        driver: String(raw.driver || raw.contact || '—').trim(),
        fuel_level: String(raw.fuel_level ?? '').trim(),
        handover_location: String(raw.handover_location || raw.location || '—').trim(),
        interior_status: String(raw.interior_status ?? '').trim(),
        exterior_status: String(raw.exterior_status ?? '').trim(),
        handover_notes: String(raw.handover_notes ?? '').trim(),
        photo_front: photoFields[0].url,
        photo_rear: photoFields[1].url,
        photo_left: photoFields[2].url,
        photo_right: photoFields[3].url,
        photo_interior: photoFields[4].url,
        photo_dashboard: photoFields[5].url,
        photo_damage: photoFields[6].url,
        handover_date: String(raw.handover_date ?? '').trim(),
        driver_licence: driverLicenceUrl,
        photos: photoFields,
        attachedPhotos: attachedPhotos,
        hasInspection: hasInspectionData
    };
}

function applyRawRows(rawRows, shouldUpdateCalendarFocus = false) {
    // Filter out completely blank sheet rows
    const validRows = rawRows.filter(r => r && (r.booking_id || r.id || r.client || r.service));
    state.bookings = validRows.map((r, i) => normalizeRow(r, i));
    state.inspections = state.bookings;

    if (shouldUpdateCalendarFocus && state.bookings.length > 0) {
        const firstWithDate = state.bookings.find(b => parseSafeDate(b.start));
        if (firstWithDate) {
            const d = parseSafeDate(firstWithDate.start);
            calendarMonth = d.getMonth();
            calendarYear = d.getFullYear();
        }
    }
}

// ==========================================
// FAST NON-BLOCKING LIVE DATA FETCHING
// ==========================================
async function loadData(manualRefresh = false) {
    const syncStatus = document.getElementById('sync-status');
    const syncDot = document.getElementById('sync-dot');

    if (syncStatus) syncStatus.textContent = 'Syncing live webhook…';
    if (syncDot) syncDot.style.background = '#d1b57a';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);

    try {
        const url = `${WEBHOOK_GET_BOOKINGS}?t=${Date.now()}`;
        const res = await fetch(url, {
            method: 'GET',
            cache: 'no-store',
            headers: { 'Accept': 'application/json' },
            signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error(`Webhook returned HTTP ${res.status}`);

        const text = await res.text();
        const rawJson = text ? JSON.parse(text) : [];
        const rows = extractRows(rawJson);

        applyRawRows(rows, !manualRefresh);
        isLoading = false;
        lastSyncError = null;

        try {
            sessionStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(rows));
        } catch (_) {}

        if (syncStatus) syncStatus.textContent = `Live · ${state.bookings.length} row(s) synced`;
        if (syncDot) syncDot.style.background = '#42b883';
        if (manualRefresh) toast(`Synchronized ${state.bookings.length} live record(s) from webhook.`);
    } catch (err) {
        clearTimeout(timeoutId);
        isLoading = false;
        lastSyncError = err.message || 'Connection failed';
        if (syncStatus) syncStatus.textContent = state.bookings.length ? `Cached (${state.bookings.length} rows)` : 'Webhook unreachable';
        if (syncDot) syncDot.style.background = '#b95249';
        if (manualRefresh) toast(`Webhook sync error: ${lastSyncError}`);
    }

    render();
}

// Hydrate from sessionStorage immediately for 0ms initial paint while live webhook loads
function hydrateFromCache() {
    try {
        const cached = sessionStorage.getItem(STORAGE_CACHE_KEY);
        if (cached) {
            const rows = JSON.parse(cached);
            if (Array.isArray(rows) && rows.length > 0) {
                applyRawRows(rows, true);
                isLoading = false;
            }
        }
    } catch (_) {}
}

function calendar() {
    const first = new Date(calendarYear, calendarMonth, 1);
    const days = new Date(calendarYear, calendarMonth + 1, 0).getDate();
    const offset = (first.getDay() + 6) % 7;
    const todayStr = toYMD(new Date());

    return `<section class="panel">
        <div class="panel-head">
            <div>
                <h2>Vehicle Deployment Schedule</h2>
                <p>Live bookings mapped across their start_date and end_date (${first.toLocaleDateString('en-ZA', { month: 'long', year: 'numeric' })}).</p>
            </div>
            <div class="month-nav">
                <button class="btn" data-action="toggle-cal-filter">${showAllCalendar ? 'Showing: All Bookings (' + state.bookings.length + ')' : 'Showing: Approved Only'}</button>
                <button class="icon-btn" data-action="month-prev" title="Previous Month">‹</button>
                <strong style="min-width:130px;text-align:center">${first.toLocaleDateString('en-ZA', { month: 'long', year: 'numeric' })}</strong>
                <button class="icon-btn" data-action="month-next" title="Next Month">›</button>
            </div>
        </div>
        <div class="calendar-wrap">
            <div class="calendar">
                ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="day-name">${d}</div>`).join('')}
                ${Array.from({ length: offset }, () => '<div class="day empty"></div>').join('')}
                ${Array.from({ length: days }, (_, j) => {
                    const d = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(j + 1).padStart(2, '0')}`;
                    const dayBookings = state.bookings.filter(b => {
                        if (!b.start) return false;
                        const end = b.end || b.start;
                        const statusOk = showAllCalendar || /Approved/i.test(b.status);
                        return statusOk && b.start <= d && end >= d;
                    });
                    return `<div class="day ${d === todayStr ? 'today' : ''}">
                        <div class="day-num"><span>${j + 1}</span>${dayBookings.length ? `<small>${dayBookings.length}</small>` : ''}</div>
                        ${dayBookings.map(b => `
                            <button class="calendar-event ${!/Approved/i.test(b.status) ? 'pending-ev' : ''}" data-action="booking" data-id="${esc(b.id)}" title="${esc(b.booking_id)}: ${esc(b.client)} — ${esc(b.service)} (${esc(b.start)} to ${esc(b.end)})">
                                ${esc(b.booking_id)} · ${esc(b.service)}
                                <small>${esc(b.client)}</small>
                            </button>
                        `).join('')}
                    </div>`;
                }).join('')}
            </div>
        </div>
        <div class="panel-foot">
            <span>Click any scheduled vehicle deployment to view booking details, pre-inspection conditions, or attached photos.</span>
            <span>Total synced rows: ${state.bookings.length}</span>
        </div>
    </section>`;
}

                <button class="strip-thumb ${f.key === current.key ? 'active' : ''}" data-action="view-file" data-id="${esc(b.id)}" data-key="${f.key}">

        `<a class="btn" id="lightbox-open-link" href="${esc(initialUrl)}" target="_blank" rel="noopener">Open Full Resolution ↗</a>
         <button class="btn" data-action="inspection" data-id="${esc(b.id)}">${icon('clipboard')}Full Pre-Inspection Report</button>
         <button class="btn primary" data-action="close">Close</button>`
    );

    // On-demand resolve if it's an ibb.co viewer shortlink
    const resolved = await resolveImgBBUrl(current.url);

function approval(id) {
    const b = booking(id);
    if (!b) return;
    openDialog('Approve booking', `${esc(b.booking_id)} · ${esc(b.client)}`, `
        <form id="approval-form">
            <div class="booking-summary"><span class="summary-icon">${icon('car')}</span><div><h3>${esc(b.service)}</h3><p>Confirm the final details and value before approval.</p></div></div>
            <div class="form-grid" style="margin-top:18px">
                <label class="field full">Confirmed value (ZAR, before tax)<input type="number" name="amount" min="0.01" step="0.01" value="${b.amount}" required></label>
                <label class="field">Start date<input name="start" type="date" value="${esc(b.start)}" required></label>
                <label class="field">End date<input name="end" type="date" value="${esc(b.end)}" required></label>
                <label class="field full">Operations note<textarea name="notes">${esc(b.notes)}</textarea></label>
            </div>
            <div class="info-box" style="margin-top:16px">Approving this will update the Google Sheet via webhook and transition to invoice preparation.</div>
            <p id="approval-error" style="color:var(--red);font-size:11px;margin-top:8px" role="alert"></p>
        </form>
    `, `<button class="btn" data-action="booking" data-id="${esc(id)}">Back</button><button class="btn primary" type="submit" form="approval-form" id="approve-submit">${icon('check')}Approve Booking</button>`);

    document.getElementById('approval-form').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const start = f.get('start'), end = f.get('end'), amount = Number(f.get('amount'));
        if (end < start) { document.getElementById('approval-error').textContent = 'End date must be on or after the start date.'; return; }

        Object.assign(b, { start, end, start_date: start, end_date: end, amount, notes: f.get('notes'), status: 'Approved' });

        const btn = document.getElementById('approve-submit');
        btn.innerHTML = 'Saving...'; btn.disabled = true;

        try {
            await fetch(WEBHOOK_POST_APPROVE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
            toast('Booking approved. Preparing invoice.');
            render();
            invoice(id);
        } catch (err) {
            toast('Warning: Could not reach approval endpoint.');
            btn.innerHTML = `${icon('check')}Approve Booking`; btn.disabled = false;
        }
    };
}

function nextInvoiceId() {
    const n = Math.max(40, ...state.invoices.map(i => Number(i.id.split('-').at(-1)))) + 1;
    return 'INV-2026-' + String(n).padStart(3, '0');
}

// Manage and Send Invoice View
function invoice(id) {
    const b = booking(id);
    if (!b) return;
    if (!/Approved/i.test(b.status)) { toast('Approve this booking before preparing an invoice.'); return viewBooking(id); }

    const existing = state.invoices.find(i => i.bookingId === id);
    const draft = existing ? structuredClone(existing) : { id: nextInvoiceId(), bookingId: id, amount: b.amount, tax: 15, deposit: 50, due: b.start, notes: '', status: 'Draft' };

    openDialog('Prepare invoice', `${draft.id} · ${esc(b.client)}`, `
        <div class="invoice-layout">
            <form class="invoice-editor" id="invoice-form">
                <div class="form-grid">
                    <label class="field full">Recipient email<input name="email" type="email" required value="${esc(b.email)}"></label>
                    <label class="field full">Service amount (ZAR)<input name="amount" type="number" step="0.01" required value="${draft.amount}"></label>
                    <label class="field">Tax rate (%)<input name="tax" type="number" min="0" max="100" step="0.01" value="${draft.tax}" required></label>
                    <label class="field">Deposit (%)<input name="deposit" type="number" min="0" max="100" value="${draft.deposit}" required></label>
                    <label class="field full">Payment due date<input name="due" type="date" required value="${esc(draft.due)}"></label>
                    <label class="field full">Invoice notes<textarea name="notes" placeholder="Payment terms or service notes…">${esc(draft.notes)}</textarea></label>
                </div>
                <div class="info-box" style="margin-top:16px">This generates the final PDF invoice and emails it directly to the client.</div>
            </form>
            <div class="invoice-paper" id="invoice-paper"></div>
        </div>
    `, `<button class="btn" data-action="close">Close</button><button class="btn" id="print-invoice">${icon('print')}Print / PDF</button><button class="btn primary" id="send-invoice">${icon('mail')}Send Mail</button>`);

    const form = document.getElementById('invoice-form');
    const read = () => {
        const f = new FormData(form);
        return { ...draft, amount: Number(f.get('amount')), tax: Number(f.get('tax')), deposit: Number(f.get('deposit')), due: f.get('due'), notes: f.get('notes'), email: f.get('email') };
    };

    function preview() {
        const i = read(), total = i.amount * (1 + i.tax / 100);
        document.getElementById('invoice-paper').innerHTML = `
            <div class="brand"><span class="monogram">S&H</span><span><strong>S&H CONSULTING</strong><small>MOBILITY PORTAL</small></span></div>
            <div class="eyebrow">INVOICE PREVIEW</div><h2>${esc(i.id)}</h2>
            <div class="invoice-meta"><div><small>BILL TO</small><br><strong>${esc(b.client)}</strong><br>${esc(i.email)}</div><div><small>BOOKING</small><br>${esc(b.booking_id)}<br>Due ${i.due ? date(i.due) : '—'}</div></div>
            <div class="invoice-line"><span>${esc(b.service)}<br><small>${fullDate(b.start)} – ${fullDate(b.end)}</small></span><b>${money(i.amount)}</b></div>
            <div class="invoice-line"><span>Tax (${i.tax || 0}%)</span><span>${money(i.amount * i.tax / 100)}</span></div>
            <div class="invoice-total"><b>Total</b><b>${money(total)}</b></div>
            <div class="invoice-line"><span>Deposit (${i.deposit || 0}%)</span><b>${money(total * i.deposit / 100)}</b></div>
            <div class="invoice-line"><span>Remaining balance</span><span>${money(total * (1 - i.deposit / 100))}</span></div>
            <small style="display:block;white-space:pre-wrap;overflow-wrap:anywhere">${esc(i.notes) || 'Thank you for choosing S&H Consulting.'}</small>
            <div class="watermark">${i.status === 'Sent' ? 'SENT' : 'DRAFT · NOT SENT'}</div>
        `;
    }

    function persist() {
        if (!form.reportValidity()) return null;
        const i = read();
        const index = state.invoices.findIndex(x => x.bookingId === id);
        if (index < 0) state.invoices.unshift(i); else state.invoices[index] = i;
        b.email = i.email;
        return i;
    }

    form.addEventListener('input', preview);
    preview();

    document.getElementById('print-invoice').onclick = () => { if (persist()) { preview(); window.print(); } };
    document.getElementById('send-invoice').onclick = async () => {
        const i = persist();
        if (!i) return;
        const btn = document.getElementById('send-invoice');
        btn.innerHTML = 'Sending...'; btn.disabled = true;

        const payload = {
            invoiceId: i.id,
            bookingId: b.booking_id,
            recipient: i.email,
            amount: i.amount,
            taxRate: i.tax,
            deposit: i.deposit,
            dueDate: i.due,
            invoiceNotes: i.notes,
            status: 'Sent',
            bookingData: b
        };

        try {
            await fetch(WEBHOOK_POST_INVOICE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            toast('Invoice sent to client successfully.');
            i.status = 'Sent';
            preview();
        } catch (err) {
            toast('Warning: Could not reach invoice webhook.');
        } finally {
            btn.innerHTML = `${icon('mail')}Send Mail`; btn.disabled = false;
        }
    };
}

// New Booking
function newBooking() {
    openDialog('Create car booking', 'Manual entry system synced with Google Sheets.', `
        <form id="new-form">
            <div class="form-grid">
                <label class="field">Client / organisation<input name="client" required></label>
                <label class="field">Contact person<input name="contact" required></label>
                <label class="field">Email address<input name="email" type="email" required></label>
                <label class="field">Vehicle requested<input name="service" required placeholder="e.g. Hyundai Staria"></label>
                <label class="field">Start date<input name="start_date" type="date" required></label>
                <label class="field">End date<input name="end_date" type="date" required></label>
                <label class="field">Value based pricing (ZAR)<input name="amount" type="number" step="0.01" required></label>
                <label class="field">Route / Location<input name="location" required placeholder="e.g. Pretoria → Johannesburg"></label>
                <label class="field">Assigned Driver<input name="driver" placeholder="e.g. Sylvester M."></label>
                <label class="field">Handover Location<input name="handover_location" placeholder="e.g. Pretoria"></label>
                <label class="field full">Request notes<textarea name="notes"></textarea></label>
            </div>
        </form>
    `, `<button class="btn" data-action="close">Cancel</button><button class="btn primary" id="btn-submit-booking" form="new-form" type="submit">${icon('plus')}Submit Booking</button>`);

    document.getElementById('new-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit-booking');
        btn.innerHTML = 'Submitting...'; btn.disabled = true;

        const f = Object.fromEntries(new FormData(e.target));
        const nums = state.bookings.map(b => Number(String(b.booking_id).replace(/\D+/g, '')) || 1040);
        const nextNum = Math.max(1040, ...nums) + 1;
        const newRaw = {
            ...f,
            booking_id: 'BK-' + nextNum,
            id: 'BK-' + nextNum,
            start: f.start_date,
            end: f.end_date,
            amount: Number(f.amount),
            status: 'Pending',
            timestamp: new Date().toISOString().slice(0, 19).replace('T', ' ')
        };

        try {
            await fetch(WEBHOOK_POST_BOOKING, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newRaw) });
            closeDialog();
            toast('Booking submitted. Refreshing live sheet data…');
            await loadData(false);
        } catch (err) {
            toast('Network error: Could not submit booking.');
            btn.innerHTML = `${icon('plus')}Submit Booking`; btn.disabled = false;
        }
    };
}

// ==========================================
// EVENT DELEGATION & LISTENERS
// ==========================================
document.getElementById('menu-btn').onclick = () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('menu-overlay').classList.toggle('open');
};
document.getElementById('menu-overlay').onclick = () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('menu-overlay').classList.remove('open');
};

document.getElementById('refresh-btn').onclick = async () => {
    const svg = document.querySelector('#refresh-btn span svg');
    if (svg) svg.classList.add('spin');
    await loadData(true);
    if (svg) svg.classList.remove('spin');
};

document.addEventListener('click', e => {
    const n = e.target.closest('[data-nav]');
    if (n) { setPage(n.dataset.nav); return; }

    const ft = e.target.closest('[data-filter]');
    if (ft) { filter = ft.dataset.filter; render(); return; }

    const ift = e.target.closest('[data-insp-filter]');
    if (ift) { inspFilter = ift.dataset.inspFilter; render(); return; }

    const el = e.target.closest('[data-action]');
    if (!el) return;

    const a = el.dataset.action, id = el.dataset.id, key = el.dataset.key;
    switch (a) {
        case 'close': closeDialog(); break;
        case 'new': newBooking(); break;
        case 'booking': viewBooking(id); break;
        case 'approval': approval(id); break;
        case 'invoice': invoice(id); break;
        case 'inspection': viewInspection(id); break;
        case 'view-file': openFileViewer(id, key); break;
        case 'toggle-cal-filter':
            showAllCalendar = !showAllCalendar;
            render();
            break;
        case 'mark-reviewed': {
            const item = booking(id);
            if (item) {
                const btn = document.getElementById('btn-mark-reviewed');
                if (btn) { btn.innerHTML = 'Updating...'; btn.disabled = true; }
                fetch(WEBHOOK_POST_INSPECTION_REVIEW, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ booking_id: item.booking_id, inspectionId: item.booking_id, status: 'Reviewed' })
                })
                .then(() => {
                    closeDialog(); loadData(false); toast(`Pre-inspection for ${item.booking_id} marked as reviewed.`);
                })
                .catch(() => {
                    toast('Warning: Could not reach review webhook.');
                    if (btn) { btn.innerHTML = `${icon('check')}Confirm Inspection Reviewed`; btn.disabled = false; }
                });
            }
            break;
        }
        case 'month-prev':
        case 'month-next':
            calendarMonth += a === 'month-next' ? 1 : -1;
            if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
            if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
            render();
            break;
    }
});

document.addEventListener('input', e => {
    if (e.target.id === 'booking-search' || e.target.id === 'global-search') {
        query = e.target.value;
        const otherId = e.target.id === 'booking-search' ? 'global-search' : 'booking-search';
        const otherInput = document.getElementById(otherId);
        if (otherInput && otherInput.value !== query) otherInput.value = query;
        updateSearchResultsOnly();
    }
});

// INITIALIZE: Instant UI render + immediate live webhook fetch
hydrateFromCache();
render();
loadData(false);
</script>
